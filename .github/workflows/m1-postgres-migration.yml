name: M1 PostgreSQL migration acceptance

on:
  pull_request:
  push:
    branches: [main]

jobs:
  postgres-migrations-and-storage-paths:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dermai_m1_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dermai_m1_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: dermai_m1_test
      DB_USER: postgres
      DB_PASSWORD: postgres
      JWT_SECRET_KEY: ci-only-jwt-secret-not-for-deployment-000000
      CSRF_SECRET_KEY: ci-only-csrf-secret-not-for-deployment-000000
      DERMAI_M1_TEST_POSTGRES_URL: postgresql+psycopg://postgres:postgres@localhost:5432/dermai_m1_test
      DERMAI_ALLOW_DISPOSABLE_POSTGRES_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest 'psycopg[binary]==3.3.6'
      - name: Run PostgreSQL migration and storage path acceptance
        run: >-
          python -m pytest -p no:cacheprovider
          tests/test_postgres_migration_acceptance.py
          tests/test_image_storage_paths.py -q
